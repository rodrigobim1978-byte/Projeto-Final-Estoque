<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produtos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Produtos
            <span class="badge text-bg-secondary align-middle" th:text="${#lists.size(produtos)} + ' registro(s)'">0 registro(s)</span>
        </h1>
        <a th:href="@{/produtos/novo}" class="btn btn-app"><i class="bi bi-plus-lg"></i> Novo produto</a>
    </div>

    <!-- Mensagem de sucesso: fragmento reaproveitado do layout -->
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <!-- Mensagem quando ainda não há registros -->
    <div th:if="${#lists.isEmpty(produtos)}" class="alert alert-info">Nenhum registro encontrado.</div>

    <div class="card shadow-sm" th:unless="${#lists.isEmpty(produtos)}">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>Unidade</th>
                    <th class="text-end">Preço de custo</th>
                    <th class="text-end">Estoque mínimo</th>
                    <th class="text-end">Saldo</th>
                    <th>Categoria</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <!-- th:each repete a linha <tr> para cada item da lista "produtos" -->
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.codigo}">Código</td>
                    <td th:text="${produto.nome}">Nome</td>
                    <td th:text="${produto.unidade}">Unidade</td>
                    <td class="text-end text-nowrap" th:text="${produto.precoCusto != null} ? ${'R$ ' + #numbers.formatDecimal(produto.precoCusto, 1, 'POINT', 2, 'COMMA')} : '-'">R$ 0,00</td>
                    <td class="text-end" th:text="${produto.estoqueMinimo}">0</td>
                    <td class="text-end" th:text="${produto.saldo}">0</td>
                    <td th:text="${produto.categoria != null} ? ${produto.categoria.nome} : '-'">Categoria</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/produtos/{id}/editar(id=${produto.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i> Editar</a>
                        <!-- Excluir usa um formulário POST; o confirm() pede confirmação antes de enviar -->
                        <form th:action="@{/produtos/{id}/excluir(id=${produto.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Confirma a exclusão deste registro?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
