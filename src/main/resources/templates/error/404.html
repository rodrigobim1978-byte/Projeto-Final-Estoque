<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
    Página NÃO ENCONTRADA (erro 404).
    O Spring Boot mostra automaticamente templates/error/404.html quando o endereço
    pedido não existe no sistema (por exemplo, um endereço digitado errado).
-->
<head th:replace="~{fragments/layout :: head('Página não encontrada')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 560px;">
        <div class="card-body p-4 text-center">
            <div class="display-6 text-secondary mb-2"><i class="bi bi-signpost-split"></i></div>
            <h1 class="h4">Página não encontrada</h1>
            <p class="text-muted mb-4">O endereço digitado não existe. Confira o endereço ou use o menu.</p>
            <a th:href="@{/}" class="btn btn-app">Voltar ao início</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
