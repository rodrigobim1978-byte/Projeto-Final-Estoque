<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Movimentações')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <!-- O mesmo formulário serve para cadastrar (id vazio) e para editar (id preenchido) -->
    <h1 class="h4 mb-3" th:text="${movimentacao.id == null} ? 'Nova movimentação' : 'Editar movimentação'">Nova movimentação</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <!-- th:object liga o formulário ao objeto "movimentacao"; *{campo} = um atributo desse objeto -->
            <form th:action="@{/movimentacoes/salvar}" th:object="${movimentacao}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="produto">Produto *</label>
                        <!-- Lista de escolha: cada opção envia o id; o conversor (config/Conversores.java) transforma o id no objeto -->
                        <select id="produto" name="produto" class="form-select" th:classappend="${#fields.hasErrors('produto')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="item : ${produtos}" th:value="${item.id}" th:text="${item.codigo + ' · ' + item.nome}"
                                    th:selected="${movimentacao.produto != null and movimentacao.produto.id == item.id}">Produto</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('produto')}" th:errors="*{produto}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="tipo">Tipo *</label>
                        <!-- Lista de escolha com opções fixas -->
                        <select id="tipo" name="tipo" class="form-select" th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option value="Entrada" th:selected="${movimentacao.tipo == 'Entrada'}">Entrada</option>
                            <option value="Saída" th:selected="${movimentacao.tipo == 'Saída'}">Saída</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="quantidade">Quantidade *</label>
                        <input type="number" step="1" class="form-control" th:field="*{quantidade}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="data">Data *</label>
                        <input type="date" class="form-control" th:field="*{data}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('data')}" th:errors="*{data}">Erro</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="observacao">Observação</label>
                        <textarea class="form-control" rows="3" th:field="*{observacao}" th:errorclass="is-invalid"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('observacao')}" th:errors="*{observacao}">Erro</div>
                    </div>
                </div>
                <p class="text-muted small mt-3 mb-0">* Campos obrigatórios</p>
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-app"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/movimentacoes}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
