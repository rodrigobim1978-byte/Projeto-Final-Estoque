<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Movimentações')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Movimentações
            <span class="badge text-bg-secondary align-middle" th:text="${#lists.size(movimentacoes)} + ' registro(s)'">0 registro(s)</span>
        </h1>
        <a th:href="@{/movimentacoes/novo}" class="btn btn-app"><i class="bi bi-plus-lg"></i> Nova movimentação</a>
    </div>

    <!-- Mensagem de sucesso: fragmento reaproveitado do layout -->
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <!-- Mensagem quando ainda não há registros -->
    <div th:if="${#lists.isEmpty(movimentacoes)}" class="alert alert-info">Nenhum registro encontrado.</div>

    <div class="card shadow-sm" th:unless="${#lists.isEmpty(movimentacoes)}">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Data</th>
                    <th>Tipo</th>
                    <th>Produto</th>
                    <th class="text-end">Quantidade</th>
                    <th>Observação</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <!-- th:each repete a linha <tr> para cada item da lista "movimentacoes" -->
                <tr th:each="movimentacao : ${movimentacoes}">
                    <td th:text="${#temporals.format(movimentacao.data, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td th:text="${movimentacao.tipo}">Tipo</td>
                    <td th:text="${movimentacao.produto.nome}">Produto</td>
                    <td class="text-end" th:text="${movimentacao.quantidade}">0</td>
                    <td th:text="${movimentacao.observacao}">Observação</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/movimentacoes/{id}/editar(id=${movimentacao.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i> Editar</a>
                        <!-- Excluir usa um formulário POST; o confirm() pede confirmação antes de enviar -->
                        <form th:action="@{/movimentacoes/{id}/excluir(id=${movimentacao.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Confirma a exclusão deste registro?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Excluir</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
