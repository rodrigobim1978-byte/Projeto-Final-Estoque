<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Movimentações')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Movimentações
            <span class="badge text-bg-secondary align-middle" th:text="${#lists.size(movimentacoes)} + ' registro(s)'">0 registro(s)</span>
        </h1>
        <a th:href="@{/movimentacoes/novo}" class="btn btn-app"><i class="bi bi-plus-lg"></i> Nova movimentação</a>
    </div>

    <!-- Mensagem de sucesso: fragmento reaproveitado do layout -->
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <!-- Filtro: envia a escolha como ?tipo=... para o próprio endereço da lista -->
    <form th:action="@{/movimentacoes}" method="get" class="d-flex gap-2 mb-3">
        <select name="tipo" class="form-select w-auto">
            <option value="">Todos os tipos</option>
            <option th:each="item : ${tipos}" th:value="${item}" th:text="${item.descricao}"
                    th:selected="${item == tipo}">Tipo</option>
        </select>
        <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-funnel"></i> Filtrar</button>
    </form>

    <!-- Mensagem quando ainda não há registros -->
    <div th:if="${#lists.isEmpty(movimentacoes)}" class="alert alert-info">Nenhum registro encontrado.</div>

    <div class="card shadow-sm" th:unless="${#lists.isEmpty(movimentacoes)}">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Data</th>
                    <th>Tipo</th>
                    <th>Produto</th>
                    <th class="text-end">Quantidade</th>
                    <th>Observação</th>
                </tr>
                </thead>
                <tbody>
                <!-- th:each repete a linha <tr> para cada item da lista "movimentacoes" -->
                <tr th:each="movimentacao : ${movimentacoes}">
                    <td th:text="${#temporals.format(movimentacao.data, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${movimentacao.tipo.cor}" th:text="${movimentacao.tipo.descricao}">Tipo</span></td>
                    <td th:text="${movimentacao.produto.nome}">Produto</td>
                    <td class="text-end" th:text="${movimentacao.quantidade}">0</td>
                    <td th:text="${movimentacao.observacao}">Observação</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
